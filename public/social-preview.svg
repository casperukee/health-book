<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Health Youpu / 健康有谱</title>
  <desc id="desc">Social preview card for the open-source family health literacy book Health Youpu.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.58" stop-color="#f0fdfa"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="mark-bg" x1="24" y1="16" x2="144" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#115e59"/>
      <stop offset="0.58" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="48" y="48" width="1184" height="544" rx="36" fill="#ffffff" filter="url(#soft-shadow)"/>
  <rect x="48" y="48" width="1184" height="544" rx="36" fill="none" stroke="#ccfbf1" stroke-width="2"/>

  <g transform="translate(94 90) scale(1.78)">
    <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#mark-bg)"/>
    <path d="M18 20h28M18 44h28" fill="none" stroke="#ccfbf1" stroke-width="4" stroke-linecap="round" opacity=".78"/>
    <path d="M17 33h10l4-8 7 18 5-12h7" fill="none" stroke="#f8fafc" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="31" r="3.8" fill="#fbbf24"/>
  </g>

  <text x="230" y="134" fill="#0f172a" font-size="38" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Health Youpu</text>
  <text x="230" y="190" fill="#0f172a" font-size="58" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">健康有谱</text>
  <text x="230" y="244" fill="#334155" font-size="28" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">给家庭的长期健康读本</text>

  <g transform="translate(96 324)">
    <rect width="315" height="96" rx="22" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="30" y="40" fill="#115e59" font-size="22" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">分清急缓</text>
    <text x="30" y="70" fill="#334155" font-size="19" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">急救、门诊、记录观察</text>
  </g>
  <g transform="translate(448 324)">
    <rect width="315" height="96" rx="22" fill="#fffbeb" stroke="#fde68a"/>
    <text x="30" y="40" fill="#92400e" font-size="22" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">准备就医</text>
    <text x="30" y="70" fill="#334155" font-size="19" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">把症状、报告和问题说清</text>
  </g>
  <g transform="translate(800 324)">
    <rect width="335" height="96" rx="22" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="30" y="40" fill="#334155" font-size="22" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">守住边界</text>
    <text x="30" y="70" fill="#334155" font-size="19" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">不诊断，不替代医生</text>
  </g>

  <line x1="96" y1="478" x2="1135" y2="478" stroke="#e2e8f0" stroke-width="2"/>

  <text x="96" y="530" fill="#0f766e" font-size="26" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">github.com/casperukee/health-book</text>
  <text x="96" y="565" fill="#64748b" font-size="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Mirror: health.mindarae.com</text>
  <text x="880" y="548" fill="#0f172a" font-size="24" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Open-source health literacy</text>
  <text x="880" y="579" fill="#64748b" font-size="20" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Maintained by casper</text>
</svg>
