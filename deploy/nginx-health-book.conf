server {
    listen 80;
    server_name health.mindarae.com;

    root /srv/health-book/current;
    index index.html;

    access_log /srv/health-book/shared/logs/access.log;
    error_log /srv/health-book/shared/logs/error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
