<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="活动结构：先有地基，再谈训练">
  <defs>
    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="9" stdDeviation="16" flood-color="#203d36" flood-opacity="0.08" />
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; dominant-baseline: alphabetic; }
  </style>
  <rect width="1200" height="760" fill="#f8fbf8" />
  <circle cx="1030" cy="108" r="170" fill="#e2f3ed" opacity="0.46" />
  <circle cx="110" cy="700" r="160" fill="#e5f0f8" opacity="0.38" />

  <text x="70" y="126" font-size="40" font-weight="900" fill="#1f302d">活动结构：先有地基，再谈训练</text>
  <text x="72" y="178" font-size="22" font-weight="520" fill="#66736f">运动不是一次狠练，而是让几种身体能力长期被使用</text>

  <g filter="url(#softShadow)">
    <rect x="130" y="552" width="640" height="92" rx="24" fill="#e2f3ed" stroke="#c9d8d2" stroke-width="2" />
    <rect x="180" y="454" width="540" height="86" rx="24" fill="#fff1d6" stroke="#c9d8d2" stroke-width="2" />
    <rect x="230" y="362" width="440" height="80" rx="23" fill="#e5f0f8" stroke="#c9d8d2" stroke-width="2" />
    <rect x="280" y="276" width="340" height="74" rx="22" fill="#ece9f7" stroke="#c9d8d2" stroke-width="2" />
    <rect x="330" y="198" width="240" height="66" rx="21" fill="#f8dfdd" stroke="#c9d8d2" stroke-width="2" />
  </g>

  <text x="450" y="592" text-anchor="middle" font-size="28" font-weight="900" fill="#1f302d">日常活动地基</text>
  <text x="450" y="624" text-anchor="middle" font-size="18" font-weight="540" fill="#66736f">走路、爬楼、家务、饭后散步、减少久坐</text>

  <text x="450" y="491" text-anchor="middle" font-size="26" font-weight="900" fill="#1f302d">有氧心肺</text>
  <text x="450" y="522" text-anchor="middle" font-size="18" font-weight="540" fill="#66736f">选能长期做的：快走、骑车、游泳、跳操</text>

  <text x="450" y="398" text-anchor="middle" font-size="25" font-weight="900" fill="#1f302d">力量</text>
  <text x="450" y="428" text-anchor="middle" font-size="18" font-weight="540" fill="#66736f">腿、臀、背、核心，保护代谢和行动能力</text>

  <text x="450" y="309" text-anchor="middle" font-size="24" font-weight="900" fill="#1f302d">平衡、灵活、动作控制</text>
  <text x="450" y="337" text-anchor="middle" font-size="17" font-weight="540" fill="#66736f">让活动更稳，不容易被受伤打断</text>

  <text x="450" y="235" text-anchor="middle" font-size="23" font-weight="900" fill="#1f302d">安全进阶</text>
  <text x="450" y="257" text-anchor="middle" font-size="16" font-weight="540" fill="#66736f">慢慢加量，有不适先停</text>

  <g filter="url(#softShadow)">
    <rect x="830" y="246" width="290" height="286" rx="28" fill="#ffffff" stroke="#c9d8d2" stroke-width="2" />
  </g>
  <text x="875" y="302" font-size="27" font-weight="900" fill="#1f302d">先问三句</text>
  <circle cx="886" cy="352" r="7" fill="#248f75" />
  <text x="908" y="359" font-size="20" font-weight="650" fill="#1f302d">今天身体出现过几次？</text>
  <circle cx="886" cy="414" r="7" fill="#248f75" />
  <text x="908" y="421" font-size="20" font-weight="650" fill="#1f302d">有没有能长期做的活动？</text>
  <circle cx="886" cy="476" r="7" fill="#248f75" />
  <text x="908" y="483" font-size="20" font-weight="650" fill="#1f302d">进阶会不会太猛？</text>

  <text x="350" y="704" font-size="24" font-weight="900" fill="#1f302d">活动是为了增加储备，不是证明自律</text>
</svg>
