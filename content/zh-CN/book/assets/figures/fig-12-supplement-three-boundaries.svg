<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="保健品陷阱：先守三条线">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#248f75" />
    </marker>
    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#203d36" flood-opacity="0.08" />
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; dominant-baseline: alphabetic; }
  </style>
  <rect width="1200" height="760" fill="#f8fbf8" />
  <circle cx="1020" cy="110" r="170" fill="#e2f3ed" opacity="0.45" />
  <circle cx="80" cy="700" r="145" fill="#e5f0f8" opacity="0.34" />
  
  <rect x="70" y="46" width="102" height="38" rx="19" fill="#e2f3ed" />
  <text x="121" y="72" text-anchor="middle" font-size="20" font-weight="800" fill="#157c78">图 13</text>
  <text x="70" y="132" text-anchor="start" font-size="40" font-weight="900" fill="#1f302d" opacity="1">保健品陷阱：先守三条线</text>
  <text x="72" y="184" text-anchor="start" font-size="22" font-weight="500" fill="#66736f" opacity="1">不羞辱希望，也不把医疗、金钱和关系交给销售现场</text>
  
  
  <g filter="url(#softShadow)">
    <rect x="74" y="282" width="330" height="202" rx="26" fill="#f8dfdd" stroke="#c9d8d2" stroke-width="1.8" />
  </g>
  
  <text x="108" y="336" text-anchor="start" font-size="28" font-weight="900" fill="#1f302d" opacity="1">医疗底线</text>
  <text x="108" y="376" text-anchor="start" font-size="18" font-weight="520" fill="#66736f" opacity="1">不停药、不减药、不推</text>
<text x="108" y="401" text-anchor="start" font-size="18" font-weight="520" fill="#66736f" opacity="1">迟复查，也不替代治疗</text>
  
  <g filter="url(#softShadow)">
    <rect x="435" y="282" width="330" height="202" rx="26" fill="#fff1d6" stroke="#c9d8d2" stroke-width="1.8" />
  </g>
  
  <text x="469" y="336" text-anchor="start" font-size="28" font-weight="900" fill="#1f302d" opacity="1">金钱底线</text>
  <text x="469" y="376" text-anchor="start" font-size="18" font-weight="520" fill="#66736f" opacity="1">不借钱、不囤货、不在</text>
<text x="469" y="401" text-anchor="start" font-size="18" font-weight="520" fill="#66736f" opacity="1">限时气氛里交大额费用</text>
  
  <g filter="url(#softShadow)">
    <rect x="796" y="282" width="330" height="202" rx="26" fill="#e5f0f8" stroke="#c9d8d2" stroke-width="1.8" />
  </g>
  
  <text x="830" y="336" text-anchor="start" font-size="28" font-weight="900" fill="#1f302d" opacity="1">关系底线</text>
  <text x="830" y="376" text-anchor="start" font-size="18" font-weight="520" fill="#66736f" opacity="1">不隐瞒家人、不绕开医</text>
<text x="830" y="401" text-anchor="start" font-size="18" font-weight="520" fill="#66736f" opacity="1">生、不发展亲友代理</text>
  <rect x="235" y="610" width="730" height="66" rx="33" fill="#e2f3ed" stroke="#c9d8d2" stroke-width="2" />
  <text x="600" y="653" text-anchor="middle" font-size="30" font-weight="900" fill="#1f302d" opacity="1">真诚不能抵消风险，希望也需要边界</text>
</svg>
