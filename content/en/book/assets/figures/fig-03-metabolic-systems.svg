<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="四高不是四个敌人">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#248f75" />
    </marker>
    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#203d36" flood-opacity="0.08" />
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; dominant-baseline: alphabetic; }
  </style>
  <rect width="1200" height="760" fill="#f8fbf8" />
  <circle cx="1020" cy="110" r="170" fill="#e2f3ed" opacity="0.45" />
  <circle cx="80" cy="700" r="145" fill="#e5f0f8" opacity="0.34" />
  
  <rect x="70" y="46" width="102" height="38" rx="19" fill="#e2f3ed" />
  <text x="121" y="72" text-anchor="middle" font-size="20" font-weight="800" fill="#157c78">图 3</text>
  <text x="70" y="132" text-anchor="start" font-size="40" font-weight="900" fill="#1f302d" opacity="1">四高不是四个敌人</text>
  <text x="72" y="184" text-anchor="start" font-size="22" font-weight="500" fill="#66736f" opacity="1">血压、血脂、血糖、尿酸，背后都是原本有用的身体系统</text>
  
  
  <g filter="url(#softShadow)">
    <rect x="74" y="250" width="500" height="148" rx="26" fill="#f8dfdd" stroke="#c9d8d2" stroke-width="1.8" />
  </g>
  
  <text x="108" y="304" text-anchor="start" font-size="29" font-weight="900" fill="#1f302d" opacity="1">血压</text>
  <text x="108" y="344" text-anchor="start" font-size="20" font-weight="520" fill="#66736f" opacity="1">供血调度系统，长期高负荷会伤血管</text>
  
  <g filter="url(#softShadow)">
    <rect x="626" y="250" width="500" height="148" rx="26" fill="#fff1d6" stroke="#c9d8d2" stroke-width="1.8" />
  </g>
  
  <text x="660" y="304" text-anchor="start" font-size="29" font-weight="900" fill="#1f302d" opacity="1">血脂</text>
  <text x="660" y="344" text-anchor="start" font-size="20" font-weight="520" fill="#66736f" opacity="1">建造和运输系统，失衡会影响血管壁</text>
  
  <g filter="url(#softShadow)">
    <rect x="74" y="438" width="500" height="148" rx="26" fill="#e2f3ed" stroke="#c9d8d2" stroke-width="1.8" />
  </g>
  
  <text x="108" y="492" text-anchor="start" font-size="29" font-weight="900" fill="#1f302d" opacity="1">血糖</text>
  <text x="108" y="532" text-anchor="start" font-size="20" font-weight="520" fill="#66736f" opacity="1">能量处理系统，反复过高会让调节吃力</text>
  
  <g filter="url(#softShadow)">
    <rect x="626" y="438" width="500" height="148" rx="26" fill="#e5f0f8" stroke="#c9d8d2" stroke-width="1.8" />
  </g>
  
  <text x="660" y="492" text-anchor="start" font-size="29" font-weight="900" fill="#1f302d" opacity="1">尿酸</text>
  <text x="660" y="532" text-anchor="start" font-size="20" font-weight="520" fill="#66736f" opacity="1">代谢和排泄线索，不只是海鲜啤酒</text>
  <path d="M250 630 C430 690 770 690 950 630" fill="none" stroke="#248f75" stroke-width="7" stroke-linecap="round" opacity="0.9" />
  <text x="600" y="710" text-anchor="middle" font-size="30" font-weight="900" fill="#1f302d" opacity="1">问题不是它们存在，而是长期超负荷</text>
</svg>
