<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="专科问题：先问四件事">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#248f75" />
    </marker>
    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#203d36" flood-opacity="0.08" />
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; dominant-baseline: alphabetic; }
  </style>
  <rect width="1200" height="760" fill="#f8fbf8" />
  <circle cx="1020" cy="110" r="170" fill="#e2f3ed" opacity="0.45" />
  <circle cx="80" cy="700" r="145" fill="#e5f0f8" opacity="0.34" />
  
  <rect x="70" y="46" width="102" height="38" rx="19" fill="#e2f3ed" />
  <text x="121" y="72" text-anchor="middle" font-size="20" font-weight="800" fill="#157c78">图 10</text>
  <text x="70" y="132" text-anchor="start" font-size="40" font-weight="900" fill="#1f302d" opacity="1">专科问题：先问四件事</text>
  <text x="72" y="184" text-anchor="start" font-size="22" font-weight="500" fill="#66736f" opacity="1">别先猜病名，先看急缓、功能、时间线和下一步</text>
  
  
  <g filter="url(#softShadow)">
    <rect x="74" y="250" width="500" height="142" rx="26" fill="#f8dfdd" stroke="#c9d8d2" stroke-width="1.8" />
  </g>
  <text x="520" y="300" text-anchor="middle" font-size="24" font-weight="900" fill="#c84a4a" opacity="0.75">01</text>
  <text x="108" y="304" text-anchor="start" font-size="29" font-weight="900" fill="#1f302d" opacity="1">急缓</text>
  <text x="108" y="344" text-anchor="start" font-size="20" font-weight="520" fill="#66736f" opacity="1">有没有危险信号，是否需要急诊或及时</text>
<text x="108" y="371" text-anchor="start" font-size="20" font-weight="520" fill="#66736f" opacity="1">就医</text>
  
  <g filter="url(#softShadow)">
    <rect x="626" y="250" width="500" height="142" rx="26" fill="#e5f0f8" stroke="#c9d8d2" stroke-width="1.8" />
  </g>
  <text x="1072" y="300" text-anchor="middle" font-size="24" font-weight="900" fill="#4079a7" opacity="0.75">02</text>
  <text x="660" y="304" text-anchor="start" font-size="29" font-weight="900" fill="#1f302d" opacity="1">功能</text>
  <text x="660" y="344" text-anchor="start" font-size="20" font-weight="520" fill="#66736f" opacity="1">看、走、睡、吃、排尿、工作和照护受影</text>
<text x="660" y="371" text-anchor="start" font-size="20" font-weight="520" fill="#66736f" opacity="1">响了吗</text>
  
  <g filter="url(#softShadow)">
    <rect x="74" y="438" width="500" height="142" rx="26" fill="#fff1d6" stroke="#c9d8d2" stroke-width="1.8" />
  </g>
  <text x="520" y="488" text-anchor="middle" font-size="24" font-weight="900" fill="#d79523" opacity="0.75">03</text>
  <text x="108" y="492" text-anchor="start" font-size="29" font-weight="900" fill="#1f302d" opacity="1">时间线</text>
  <text x="108" y="532" text-anchor="start" font-size="20" font-weight="520" fill="#66736f" opacity="1">什么时候开始，如何变化，什么诱发和</text>
<text x="108" y="559" text-anchor="start" font-size="20" font-weight="520" fill="#66736f" opacity="1">缓解</text>
  
  <g filter="url(#softShadow)">
    <rect x="626" y="438" width="500" height="142" rx="26" fill="#e2f3ed" stroke="#c9d8d2" stroke-width="1.8" />
  </g>
  <text x="1072" y="488" text-anchor="middle" font-size="24" font-weight="900" fill="#248f75" opacity="0.75">04</text>
  <text x="660" y="492" text-anchor="start" font-size="29" font-weight="900" fill="#1f302d" opacity="1">下一步</text>
  <text x="660" y="532" text-anchor="start" font-size="20" font-weight="520" fill="#66736f" opacity="1">这次门诊要排除什么，回家后观察什么</text>
  <text x="600" y="690" text-anchor="middle" font-size="30" font-weight="900" fill="#1f302d" opacity="1">普通人不用先当医生，但要把事实带进去</text>
</svg>
